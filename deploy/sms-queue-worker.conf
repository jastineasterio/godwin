[program:godwin_sms_worker]
;--------------------------------------------------------------
; Persistent queue worker for the admission SMS queue.
; Runs exactly ONE worker process on the `sms` queue.
; Do NOT add a second worker for this queue -- the database
; driver reserves jobs atomically, but multiple workers on the
; same queue add operational overhead without benefit.
;--------------------------------------------------------------
process_name=%(program_name)s_%(process_num)0d
command=php /var/www/godwin/artisan queue:work --queue=sms --tries=3 --timeout=60 --sleep=3
directory=/var/www/godwin
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/godwin/storage/logs/sms_worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Values used by this worker (documented, not Supervisor keys):
;   --queue=sms      process ONLY the sms admission queue
;   --tries=3        max 3 attempts per job (matches SendAdmissionNotificationJob::$tries)
;   --timeout=60     kill a job that runs longer than 60 seconds
;   --sleep=3        sleep 3 seconds when the queue is empty
;
; Queue connection retry_after (config/queue.php database): 90 seconds.
; Job-level backoff (SendAdmissionNotificationJob): 10 seconds fixed between retries.
